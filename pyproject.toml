[project]
name = "coldfix"
version = "0.1.0"
description = "Finds software performance problems by running experiments, not by reading code."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldfix"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# The design documents contain illustrative Python in fenced blocks whose
# alignment is deliberate. Recent ruff formats embedded code in Markdown, which
# would rewrite them. Documents are prose.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "A",    # shadowed builtins
    "ANN",  # missing type annotations
    "B",    # bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PL",   # pylint
    "PTH",  # pathlib over os.path
    "RET",  # return simplification
    "RUF",  # ruff-specific
    "SIM",  # simplification
    "TRY",  # exception antipatterns
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

# ANN401 (no bare `Any`) is deliberately left on. CLAUDE.md permits `Any` only
# with a comment explaining why; a `# noqa: ANN401` IS that comment, so the rule
# enforces the policy rather than fighting it.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]

# Spike harnesses are measurement scripts, not product code, and three of these
# rules are actively wrong for them. Everything else still applies — the spikes
# are linted and formatted like the rest of the tree.
"spikes/**" = [
    # The ablation harness switches conditions through a module-level flag on
    # purpose. Patching and unpatching around each request instead would charge
    # setattr cost to the treatment conditions only, which is a real difference
    # between conditions that has nothing to do with what is being measured.
    "PLW0603",
    # `django.setup()` must run before any model or serializer import, so those
    # imports cannot be at the top of the file.
    "PLC0415",
    # Monkeypatching a third-party method means matching its signature, and
    # DRF's is untyped. The alternative is inventing types for someone else's
    # API and being wrong about them.
    "ANN401",
    # A measurement script that fails should say why in the message rather than
    # define an exception class that is raised once and never caught.
    "TRY003",
    # Reporting functions are long and linear by nature. Splitting a print
    # sequence into helpers to satisfy a statement count makes it harder to read.
    "PLR0915",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# `files` is overridden whenever mypy is given an explicit path, and CLAUDE.md's
# documented command is `uv run mypy .`. Without this, that command walks into
# the repositories a spike has cloned and dies on the first collision — two
# checkouts both have a top-level `manage.py`, which is "Duplicate module named
# manage" and stops the run before any of our own code is checked.
#
# `.gitignore` does not help here: mypy does not read it. Spike scaffolding is
# not product code and imports frameworks this project does not depend on, so it
# is out of scope for strict checking by intent, not just by convenience.
exclude = ["^spikes/"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: takes long enough to exclude from the fast subset (`-m 'not slow'`)",
    # Kept distinct from `slow` because the reason for skipping is different: a
    # slow test is one you choose not to wait for, a docker test is one this
    # machine cannot run at all. Conflating them would let an absent daemon read
    # as a passing fast subset.
    "docker: needs a running Docker daemon; skipped when none is listening",
]
