[project]
name = "coldfix"
version = "0.1.0"
description = "Finds software performance problems by running experiments, not by reading code."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.121.0",
    # S-3.17's search engine, not a test tool. `hypothesis.target()` is targeted
    # property-based testing (Löscher & Sagonas, ISSTA 2017) — an existing search
    # engine whose fitness function the caller supplies, which is what lets input
    # search be guided by measured cost instead of by coverage. ADR 046 records
    # why no AFL-lineage engine is wrapped instead.
    "hypothesis>=6.100",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldfix"]

[dependency-groups]
dev = [
    # S-7.3 resolves a route table by asking the framework, because a URLconf
    # built in a loop or by a DRF router has no routes to read out of a file.
    # A *dev* dependency for the same reason `langgraph` is one: nothing under
    # `src/` imports Django — the introspection program is source text run in
    # the subject's own interpreter — and the alternative to installing it is
    # testing route resolution against a fake, which would assert only what the
    # fake was written to believe.
    "django>=5.0",
    # S-7.4 mints a DRF token in the subject's interpreter, which is the one
    # credential in AC 2 that no amount of Django alone can create. Here for the
    # same reason and on the same terms as `django` above: without it that branch
    # ships unverified, and a fake token model would assert only that this file
    # knows what `Token.objects.get_or_create` is called.
    "djangorestframework>=3.18.0",
    # S-7.5 locates a project's existing factories and then *runs* one, because a
    # `FixtureRecipe` records how many rows of what a run produced and a parse
    # establishes none of that. On the same terms again: nothing under `src/`
    # imports it, the exercising program is source text, and the alternative is a
    # fake factory that seeds exactly what this project expects a factory to seed.
    "factory-boy>=3.3.3",
    "langgraph>=1.2.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# The design documents contain illustrative Python in fenced blocks whose
# alignment is deliberate. Recent ruff formats embedded code in Markdown, which
# would rewrite them. Documents are prose.
extend-exclude = ["docs"]

[tool.ruff.lint]
# The Universal Scalability Law's coefficients are named α, β and γ everywhere
# it is written about (S-3.12). Spelling them out in prose would make the module
# harder to check against the literature, which is the only thing that can
# confirm the fit is the one it claims to be.
allowed-confusables = ["α", "β", "γ", "×", "≤", "≥"]

select = [
    "A",    # shadowed builtins
    "ANN",  # missing type annotations
    "B",    # bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PL",   # pylint
    "PTH",  # pathlib over os.path
    "RET",  # return simplification
    "RUF",  # ruff-specific
    "SIM",  # simplification
    "TRY",  # exception antipatterns
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

# ANN401 (no bare `Any`) is deliberately left on. CLAUDE.md permits `Any` only
# with a comment explaining why; a `# noqa: ANN401` IS that comment, so the rule
# enforces the policy rather than fighting it.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]

# Spike harnesses are measurement scripts, not product code, and three of these
# rules are actively wrong for them. Everything else still applies — the spikes
# are linted and formatted like the rest of the tree.
"spikes/**" = [
    # The ablation harness switches conditions through a module-level flag on
    # purpose. Patching and unpatching around each request instead would charge
    # setattr cost to the treatment conditions only, which is a real difference
    # between conditions that has nothing to do with what is being measured.
    "PLW0603",
    # `django.setup()` must run before any model or serializer import, so those
    # imports cannot be at the top of the file.
    "PLC0415",
    # Monkeypatching a third-party method means matching its signature, and
    # DRF's is untyped. The alternative is inventing types for someone else's
    # API and being wrong about them.
    "ANN401",
    # A measurement script that fails should say why in the message rather than
    # define an exception class that is raised once and never caught.
    "TRY003",
    # Reporting functions are long and linear by nature. Splitting a print
    # sequence into helpers to satisfy a statement count makes it harder to read.
    "PLR0915",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# `files` is overridden whenever mypy is given an explicit path, and CLAUDE.md's
# documented command is `uv run mypy .`. Without this, that command walks into
# the repositories a spike has cloned and dies on the first collision — two
# checkouts both have a top-level `manage.py`, which is "Duplicate module named
# manage" and stops the run before any of our own code is checked.
#
# `.gitignore` does not help here: mypy does not read it. Spike scaffolding is
# not product code and imports frameworks this project does not depend on, so it
# is out of scope for strict checking by intent, not just by convenience.
exclude = ["^spikes/"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# With no `__init__.py` in the tree, pytest puts each test module's own
# directory on `sys.path` — `tests/primitives`, not `tests` — so the shared
# fixture package resolves only for the test files sitting at the top level.
# Naming it here rather than in a `tests/conftest.py`, because a second file
# named `conftest` collides with `tests/sandbox/conftest.py` under mypy.
pythonpath = ["tests"]
markers = [
    "slow: takes long enough to exclude from the fast subset (`-m 'not slow'`)",
    # Kept distinct from `slow` because the reason for skipping is different: a
    # slow test is one you choose not to wait for, a docker test is one this
    # machine cannot run at all. Conflating them would let an absent daemon read
    # as a passing fast subset.
    "docker: needs a running Docker daemon; skipped when none is listening",
    # Separate from `docker` even though it starts one, because what it needs is
    # a database server that answers — a daemon that is up but cannot pull or
    # run Postgres fails these for a different reason and should say so.
    "postgres: needs a real Postgres server; skipped when one cannot be started",
    # Separate again, because what it needs is neither slow nor local: S-7.12's
    # AC 5 asks that a dependency set resolve differently at an anchor than at
    # HEAD, and nothing but a real package index can show that. A fake resolver
    # would return whichever answer the test wrote into it.
    "index: needs a reachable package index; skipped when PyPI cannot be read",
]
