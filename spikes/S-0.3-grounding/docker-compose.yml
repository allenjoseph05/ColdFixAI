# Throwaway environment for the S-0.3 grounding spike: a Postgres to ground
# against, and a bare Linux box to do the grounding from.
#
# One Postgres instance, three databases — one per candidate repository.
# Database setup is not the friction under test; the repositories are. Removing
# this yak is legitimate, removing theirs is not.

services:
  postgres:
    image: postgres:16-alpine
    container_name: coldfix-spike-db
    environment:
      POSTGRES_USER: coldfix_test
      POSTGRES_PASSWORD: coldfix_test
      POSTGRES_DB: coldfix_test
    ports:
      # Deliberately not 5432. A local Postgres already listening there produces
      # a connection that succeeds against the wrong database, which is a far
      # worse failure than one that is refused.
      - "55432:5432"
    volumes:
      - spike-pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # "started" and "accepting connections" are different states, and telling
      # them apart by hand here is the same problem S-7.2 gives the Explorer
      # `logs()` and `ps()` to solve.
      test: ["CMD-SHELL", "pg_isready -U coldfix_test -d coldfix_test"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Where the grounding actually happens.
  #
  # The runs are done from Linux, not from the Windows host, because that is the
  # environment E2 gives the Explorer. A `pycurl` wheel that does not exist for
  # Windows is friction for whoever runs this spike, but it is not friction the
  # agent will ever meet, and it would land in the recurrence matrix looking
  # like a real recurrent obstacle. Deliberately `-slim`: a bare box that has to
  # `apt install` its own build dependencies, since discovering *those* is
  # exactly the obstacle class the spike is trying to count.
  #
  # Recreate it between repositories — see the README. A container that still
  # has repo A's `apt` packages will silently ground repo B for free, and the
  # spike then under-counts the one thing it exists to measure.
  workbench:
    image: python:3.12-slim
    container_name: coldfix-spike-workbench
    working_dir: /repos
    volumes:
      - ./repos:/repos
      # Seed scripts stay outside the checkouts they seed — see seeds/seed_a.py.
      - ./seeds:/seeds:ro
    # No entrypoint of its own; it exists to be `exec`ed into.
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  spike-pgdata:
