# A complete ColdFix configuration. Copy to `coldfix.toml` and edit.
#
# Every value here is a fact about the subject that nothing under `src/` will
# guess: this tool never chooses an interpreter, an image or a database on its
# own account, and a default in a config loader is the most invisible way to
# break that — the file looks complete and the run measures something nobody
# asked for.
#
# `coldfix scan --plan` checks this file and reports what a run would be given.
# It opens no container, no database and no model client, so it costs nothing
# and needs neither Docker nor Postgres to answer.
#
# `coldfix scan --spend` is the paid path. The flag is required and there is no
# prompt, because prompts get answered by habit.

[scan]
# The repository to investigate, and the commit to check out into a worktree.
root     = "."
revision = "HEAD"

# The image the subject runs in. ColdFix measures inside it and never modifies
# it — the instrumented image is derived on top.
image = "python:3.12"

# Where worktrees and checkpoints are written. Created by the run; it does not
# need to exist yet.
worktree_root = ".coldfix/worktrees"

# Optional. Only when the subject has a database, so the production guard has
# something to check. Absent, there is nothing to guard.
# database_url = "postgresql://localhost/shop_test"

# Optional, and NOT the subject's database. This is ColdFix's own append-only
# journal: what was tried for a finding and did not work, kept where a rewind
# cannot reach it. Without one a rewound run re-measures candidates that already
# lost — `--plan` says so.
# journal_url = "postgresql://localhost/coldfix_memory"

[budget]
# Required for a scan. Without it the run has no global limit: the per-phase
# caps bound the number of steps, not what they cost.
ceiling_eur = "25.00"

# The rate the bill is converted at, and the day it was true. Quoted decimals
# rather than floats, for the reason the loader gives.
rate_eur   = "0.92"
rate_as_of = 2026-09-12
